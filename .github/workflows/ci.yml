# See reference docs at
# https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: ci
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_BUILD_DIR: ${{github.workspace}}

jobs:
  setup-env:
    runs-on: ubuntu-22.04
    outputs:
      ci_image_version: ${{ steps.set-ci-image-version.outputs.ci_image_version }}
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7

      - name: Read CI Image Version
        id: set-ci-image-version
        run: |
          # Keep this in sync with default in scripts/github-ci.sh.
          CI_IMAGE_VERSION=$(cat .containerversion)
          echo "ci_image_version=$CI_IMAGE_VERSION" >> $GITHUB_OUTPUT

  test-lint:
    runs-on: ubuntu-22.04
    needs: setup-env
    container:
      image: shiftcrypto/bitbox-wallet-app:${{ needs.setup-env.outputs.ci_image_version }}
    steps:
      - name: Clone the repo
        with:
          submodules: recursive
        uses: actions/checkout@v7
      - name: Run CI script
        # The script also runs golang-ci but it's ok: doesn't take too long and may be useful
        # to keep its linter errors in this log, too.
        run: ./scripts/github-ci.sh ci
        env:
          OS_NAME: linux

  test-windows-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Windows packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis osslsigncode 7zip
      - name: Test Linux signing and packaging
        run: python3 frontends/qt/tests/test_sign_windows_release.py

  playwright:
    runs-on: ubuntu-26.04
    needs: test-lint
    strategy:
      fail-fast: false
      matrix:
        project: [Chromium, WebKit]
    name: Playwright (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v7

      - name: Download simulator v9.24.0 from simulators.json
        run: |
          set -euo pipefail
          simulator_url=$(jq -r '.[] | select(.url | contains("firmware%2Fv9.24.0/")) | .url' backend/devices/bitbox02/testdata/simulators.json)
          simulator_sha=$(jq -r '.[] | select(.url | contains("firmware%2Fv9.24.0/")) | .sha256' backend/devices/bitbox02/testdata/simulators.json)
          mkdir -p simulator-bin
          curl -L "$simulator_url" -o simulator-bin/simulator
          echo "$simulator_sha  simulator-bin/simulator" | sha256sum -c -
          chmod +x simulator-bin/simulator

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontends/web/package.json
          cache: npm
          cache-dependency-path: frontends/web/package-lock.json

      - name: Install dependencies
        run: |
          cd frontends/web
          npm ci --ignore-scripts

      - name: Build frontend
        run: |
          cd frontends/web
          npm run build

      - name: Install Playwright browsers
        run: |
          cd frontends/web
          if [ "${{ matrix.project }}" = "Chromium" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps webkit
          fi

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install Python dependencies
        run: |
          pip install ecdsa bech32

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_USE_PREBUILT_WEB: "1"
          SIMULATOR_PATH: ${{ github.workspace }}/simulator-bin/simulator
        run: cd frontends/web && npx playwright test --project="${{ matrix.project }}"

      - name: Upload Playwright artifacts and logs.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-and-logs-${{ matrix.project }}
          path: frontends/web/test-results/*

  android:
    runs-on: ubuntu-22.04
    needs: setup-env
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    container:
      image: shiftcrypto/bitbox-wallet-app:${{ needs.setup-env.outputs.ci_image_version }}
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7
      - name: Enable caching
        uses: actions/cache@v6
        with:
          key: ${{runner.os}}-android
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
      - name: Build Android
        run: ./scripts/github-ci.sh android
        env:
          OS_NAME: linux
      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: /github/home/go/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/android/BitBoxApp/app/build/outputs/apk/debug/app-debug.apk
          name: BitBoxApp-android-${{github.sha}}.apk
          if-no-files-found: error

  qt-linux:
    runs-on: ubuntu-22.04
    needs: setup-env
    container:
      image: shiftcrypto/bitbox-wallet-app:${{ needs.setup-env.outputs.ci_image_version }}
    outputs:
      artifact-url-ai: ${{ steps.upload-ai.outputs.artifact-url }}
      artifact-url-deb: ${{ steps.upload-deb.outputs.artifact-url }}
      artifact-url-rpm: ${{ steps.upload-rpm.outputs.artifact-url }}
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build Qt-Linux
        run: ./scripts/github-ci.sh qt-linux
        env:
          OS_NAME: linux
      - name: Upload AppImage
        id: upload-ai
        uses: actions/upload-artifact@v7
        with:
          path: /github/home/go/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/qt/build/linux/BitBoxApp-*.AppImage
          name: BitBoxApp-linux-${{github.sha}}.AppImage
          if-no-files-found: error
      - name: Upload deb
        id: upload-deb
        uses: actions/upload-artifact@v7
        with:
          path: /github/home/go/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/qt/build/linux/bitbox_*.deb
          name: BitBoxApp-linux-${{github.sha}}.deb
          if-no-files-found: error
      - name: Upload rpm
        id: upload-rpm
        uses: actions/upload-artifact@v7
        with:
          path: /github/home/go/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/qt/build/linux/bitbox-*.rpm
          name: BitBoxApp-linux-${{github.sha}}.rpm
          if-no-files-found: error
  macos:
    runs-on: macos-15
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          # Take Go version to install from go.mod.
          go-version-file: 'go.mod'
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontends/web/package.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Qt
        # Qt modules: Not sure why we need qtpositioning - app compilation fails without. Maybe the webengine depends on it.
        # qtpositioning depends on qtserialport.
        # qtwebchannel is for the JS/backend bridge.
        # qtwebengine is for rendering the frontend.
        run: |
          pip install aqtinstall
          aqt install-qt mac desktop 6.8.2 --modules qtpositioning qtserialport qtwebchannel qtwebengine --outputdir ~/Qt
          echo "$HOME/Qt/6.8.2/macos/bin" >> $GITHUB_PATH
          echo "$HOME/Qt/6.8.2/macos/libexec" >> $GITHUB_PATH
      - name: Build macOS app
        run: >
          ./scripts/github-ci.sh qt-osx;
        env:
          OS_NAME: osx
      - name: Ad-hoc sign BitBox.app
        run: |
          APP_PATH="$(go env GOPATH)/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/qt/build/osx/BitBox.app"
          echo "Signing app at $APP_PATH"
          codesign --deep --force --verbose --sign - "$APP_PATH"
      - name: Verify BitBox.app signature
        run: |
          APP_PATH="$(go env GOPATH)/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/qt/build/osx/BitBox.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Archive app
        run: >
          pushd ~/go/src/github.com/BitBoxSwiss/bitbox-wallet-app/frontends/qt/build/osx;
          ditto -c -k --keepParent BitBox.app ${{github.workspace}}/BitBoxApp-macos.zip;
          popd;
      - name: Upload app
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: BitBoxApp-macos.zip
          name: BitBoxApp-macos-${{github.sha}}.zip
          if-no-files-found: error
  ios:
    runs-on: macos-26
    env:
      GO_SRC_DIR: src/github.com/BitBoxSwiss/bitbox-wallet-app
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          # Take Go version to install from go.mod.
          go-version-file: 'go.mod'
      - name: Set GOPATH
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
      - name: Copy repo to GOPATH
        # This is needed as gomobile is still unaware of go modules, so the repo must be in GOPATH
        run: |
          mkdir -p $GOPATH/$(dirname $GO_SRC_DIR)
          cp -a ${{github.workspace}} $GOPATH/$(dirname $GO_SRC_DIR)
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontends/web/package.json
      - name: Build iOS app
        run: |
          make gomobileinit
          (cd $GOPATH/$GO_SRC_DIR; make ios)
      - name: Test iOS app
        run: |
          (cd $GOPATH/$GO_SRC_DIR; make iostest)
  windows:
    runs-on: windows-2022
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Read Windows toolchain versions
        id: pins
        shell: pwsh
        run: |
          $pins = Get-Content -Raw frontends/qt/windows-toolchain.json | ConvertFrom-Json
          "node=$($pins.node.version)" >> $env:GITHUB_OUTPUT
          "go=$($pins.go.version)" >> $env:GITHUB_OUTPUT
          "qt=$($pins.qt.version)" >> $env:GITHUB_OUTPUT
          "arch=$($pins.qt.arch)" >> $env:GITHUB_OUTPUT
          "modules=$($pins.qt.modules -join ' ')" >> $env:GITHUB_OUTPUT
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.pins.outputs.go }}
      # We need to install wheel otherwise the below will fail
      # with "invalid command 'bdist_wheel'"
      # See https://github.com/jurplel/install-qt-action/issues/281
      - run: pip install wheel
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.pins.outputs.qt }}
          host: 'windows'
          target: 'desktop'
          arch: ${{ steps.pins.outputs.arch }}
          modules: ${{ steps.pins.outputs.modules }}
      - name: Provision remaining pinned tools on the hosted runner
        shell: powershell
        run: ./.github/scripts/windows-ci-toolchain.ps1
      - name: Test Windows build checks
        shell: powershell
        run: |
          ./frontends/qt/tests/test-windows-toolchain.ps1
          ./frontends/qt/tests/test_windows_build.ps1
      - name: Copy checkout to the fixed build location
        shell: powershell
        run: |
          if (Test-Path -LiteralPath 'C:\bitbox-wallet-app') {
            throw 'The CI build destination C:\bitbox-wallet-app already exists.'
          }
          # Include .git and initialized submodules; checkout's cleanup still needs the original workspace.
          # Copy symlinks themselves: Linux packaging links have no target on Windows.
          robocopy $env:GITHUB_WORKSPACE 'C:\bitbox-wallet-app' /E /SL /R:0 /NFL /NDL /NP
          # Robocopy codes below 8 indicate success; normalize them for Actions' PowerShell wrapper.
          if ($LASTEXITCODE -ge 8) {
            throw "Copying checkout failed (robocopy exit code $LASTEXITCODE)."
          }
          exit 0
      - name: Build Windows archive and installer
        working-directory: C:\bitbox-wallet-app
        run: |
          # Go records untracked files in libserver.dll's vcs.modified flag.
          changes=$(git status --porcelain)
          test -z "$changes"
          # Exercise environment isolation through the same entry point used locally.
          export CC=unverified-compiler.exe GOFLAGS=-invalid-build-flag QMAKESPEC=invalid-mkspec
          make qt-windows WINDOWS_INSTALLER=1
      - name: Upload Windows release archive
        uses: actions/upload-artifact@v7
        with:
          path: C:/bitbox-wallet-app/frontends/qt/build/BitBox-*-win64-build.tar.gz
          archive: false
          if-no-files-found: error
      - name: Upload Installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: C:/bitbox-wallet-app/frontends/qt/BitBox-installer.exe
          name: BitBoxApp-windows-${{ github.sha }}.exe
          if-no-files-found: error

  report-artifacts:
    needs: [android, qt-linux, macos, windows]
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && github.event_name == 'push' }}
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create vars
        id: vars
        run: |
          echo "git_sha_short=$(git rev-parse --short HEAD)" >> ${GITHUB_OUTPUT}
          {
            echo "git_shortlog<<EOF"
            git shortlog HEAD~..HEAD
            echo EOF
          } >> ${GITHUB_OUTPUT}
      - name: Message for success
        uses: mattermost/action-mattermost-notify@master
        continue-on-error: true
        if: job.status == 'success'
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_ICON_URL: https://cdn4.iconfinder.com/data/icons/basic-ui-2-line/32/check-mark-checklist-complete-done-512.png
          MATTERMOST_CHANNEL: eng-artifacts
          TEXT: |
            **${{ github.repository }}: Artifacts built**
            ([${{ github.ref_name }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}), [${{ steps.vars.outputs.git_sha_short }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}), [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{github.run_id}}#artifacts))
            * Android - [APK](${{needs.android.outputs.artifact-url}})
            * Linux - [AppImage](${{needs.qt-linux.outputs.artifact-url-ai}}), [DEB](${{needs.qt-linux.outputs.artifact-url-deb}}), [RPM](${{needs.qt-linux.outputs.artifact-url-rpm}})
            * MacOS - [Zip](${{needs.macos.outputs.artifact-url}})
            * Windows - [EXE](${{needs.windows.outputs.artifact-url}})
            ```
            ${{ steps.vars.outputs.git_shortlog }}
            ```

      - name: Message for failure
        uses: mattermost/action-mattermost-notify@master
        continue-on-error: true
        if: job.status == 'failure'
        with:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          MATTERMOST_ICON_URL: https://cdn4.iconfinder.com/data/icons/basic-ui-2-line/32/exclamation-mark-triangle-sign-caution-1024.png
          MATTERMOST_CHANNEL: eng-build-failures
          TEXT: |
            **Oh no! [${{ steps.vars.outputs.git_sha_short }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) failed to build.**
            See [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
  bitbox02-simulator:
    # This is a separate job because the simulator platform requirements are independent of our CI image Ubuntu version.
    runs-on: ubuntu-22.04
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Run simulator tests
        run: |
          go test -mod=vendor -tags=bitbox02_simulator ./... -count=1 -v -run 'TestSimulator*'
