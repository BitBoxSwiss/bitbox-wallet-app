name: Set up the build
description: Ninja, Python, protobuf and the compiler environment, so that a job only has to run cmake.

inputs:
  protobuf:
    description: Install protobuf, so that the tests for qm_create_protobuf register themselves.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # First, because what follows installs through it. The CLI tests are Python too, and CMake
    # registers none of them when it cannot find an interpreter, so it is asked for by name
    # rather than left to whatever the image ships.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # patchelf is not optional on Linux. qmcorecmd rewrites an rpath with it, and the tests that
    # cover that skip themselves when it is missing, so leaving it out would turn a whole module
    # green without running any of it.
    #
    # Both come from PyPI rather than from apt. The Ubuntu archive the runners are pointed at
    # goes away often enough to matter, and when it does apt sits in a retry loop until the job
    # is killed rather than failing. Neither package needs a distribution to build it, both ship
    # the binary in a wheel, and pip is the one index every job here already depends on.
    - name: Ninja and patchelf (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: python -m pip install ninja patchelf

    # install_name_tool and otool come with the command line tools, which the image has.
    - name: Ninja (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja

    - name: Ninja (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install ninja -y --no-progress

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
      with:
        arch: x64

    # protobuf, for qm_create_protobuf. The tests ask for it with
    # find_package(Protobuf CONFIG) and register themselves only when they find
    # protobuf::protoc, so a runner without one is a test that does not appear
    # rather than a job that fails. That is why nothing here is fatal.
    #
    # Windows is left out. What is wanted is the development package with its
    # CMake configuration in it, and the way to that on Windows is vcpkg
    # building protobuf and abseil from source, which is ten minutes a run for
    # one test that Linux and macOS already cover.
    # The one thing here that still wants a distribution package, the development files and
    # their CMake configuration being no part of any wheel.
    #
    # Bounded on purpose. Left alone, apt meeting an archive that does not answer retries with a
    # growing backoff and never gives up, so the job hangs until something kills it. A timeout
    # on the connection and a limit on the retries turn that into a failure inside a minute,
    # which is a thing that can be read and run again.
    - name: Protobuf (Linux)
      if: runner.os == 'Linux' && inputs.protobuf == 'true'
      shell: bash
      run: |
        sudo timeout 300 apt-get update -o Acquire::http::Timeout=15 -o Acquire::Retries=2
        sudo timeout 300 apt-get install -y protobuf-compiler libprotobuf-dev

    - name: Protobuf (macOS)
      if: runner.os == 'macOS' && inputs.protobuf == 'true'
      shell: bash
      run: brew install protobuf
