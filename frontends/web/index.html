<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta 
    name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>BitBoxApp</title>
  </head>
  <body>
    <div id="iframes" style="max-height: 300px; overflow: auto;">
      <iframe src="./public/test/test.html"></iframe>
      <iframe src="./public/test/test.html" sandbox="allow-scripts allow-same-origin"></iframe>
      <iframe src="./public/test/test.html" sandbox="allow-scripts"></iframe>
      <br>
      <iframe src="https://bitboxapp.shiftcrypto.io/widgets/test/v1/test.html"></iframe>
      <iframe src="https://bitboxapp.shiftcrypto.io/widgets/test/v1/test.html" sandbox="allow-scripts allow-same-origin"></iframe>
      <iframe src="https://bitboxapp.shiftcrypto.io/widgets/test/v1/test.html" sandbox="allow-scripts"></iframe>
      <br>
      <button id="removeIframes" type="button">Remove iframes</button>
    </div>
    <script>
      document.getElementById('removeIframes').addEventListener('click', () => {
        document.getElementById('iframes').remove();
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
